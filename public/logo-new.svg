<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 150 370 160" width="100%" height="100%">
  <defs>
    <!-- Purple Gradient for Logo and 'OX' -->
    <linearGradient id="lyreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#C77DFF" />
    </linearGradient>
  </defs>

  <g transform="translate(-50, 40)">
    <!-- Lyre Base and Curved Arms -->
    <path d="M 130 120 C 110 120, 110 160, 140 200 C 160 230, 170 240, 200 240 C 230 240, 240 230, 260 200 C 290 160, 290 120, 270 120 C 255 120, 250 135, 260 150 C 270 165, 265 190, 245 210 C 225 225, 210 225, 200 225 C 190 225, 175 225, 155 210 C 135 190, 130 165, 140 150 C 150 135, 145 120, 130 120 Z" fill="url(#lyreGrad)"/>
    
    <!-- Base Pedestal -->
    <path d="M 165 235 L 235 235 L 245 255 L 155 255 Z" fill="url(#lyreGrad)"/>

    <!-- Top Crossbar -->
    <path d="M 135 140 Q 200 120 265 140" fill="none" stroke="#E0AAFF" stroke-width="4" stroke-linecap="round"/>

    <!-- Lyre Strings -->
    <line x1="176" y1="133" x2="176" y2="240" stroke="#E0AAFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="192" y1="128" x2="192" y2="242" stroke="#E0AAFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="208" y1="128" x2="208" y2="242" stroke="#E0AAFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="224" y1="133" x2="224" y2="240" stroke="#E0AAFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(130, -120)">
    <!-- Text: MUSIC -->
    <text x="200" y="305" font-family="'Segoe UI', Helvetica, sans-serif" font-size="28" font-weight="300" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">MUSIC</text>

    <!-- Text: OX -->
    <text x="200" y="355" font-family="'Segoe UI', Helvetica, sans-serif" font-size="52" font-weight="900" fill="url(#lyreGrad)" text-anchor="middle" letter-spacing="2">OX</text>

    <!-- Text: MUSIC SCHOOL -->
    <text x="200" y="385" font-family="'Segoe UI', Helvetica, sans-serif" font-size="11" font-weight="600" fill="#888888" text-anchor="middle" letter-spacing="3">MUSIC SCHOOL</text>
    
    <!-- Decorative Lines next to Tagline -->
    <line x1="265" y1="381" x2="295" y2="381" stroke="#888888" stroke-width="1" />
    <line x1="105" y1="381" x2="135" y2="381" stroke="#888888" stroke-width="1" />
  </g>
</svg>
